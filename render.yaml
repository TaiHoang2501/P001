# Render Blueprint for the BookingBot API (Dashboard -> New -> Blueprint -> pick this repo).
# The database is external (Neon Postgres, free tier): paste its connection string into DATABASE_URL.
# Values marked `sync: false` are asked for when the Blueprint is created; never commit them.
services:
  - type: web
    name: bookingbot-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # e.g. postgresql://user:pass@ep-xxx.ap-southeast-1.aws.neon.tech/bookingbot?sslmode=require
      - key: CORS_ORIGINS
        sync: false # the Vercel site, e.g. https://bookingbot.vercel.app
      - key: LLM_PROVIDER
        value: google
      - key: GOOGLE_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemini-flash-lite-latest
      # Public demo with fake data: show OTP codes on screen (no SMS/Zalo provider yet)
      - key: OTP_EXPOSE_CODE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
