name: Deploy to Cloud Run

# Runs the API on Google Cloud Run next to Render (render.yaml); both use the same Dockerfile and Neon database.
# Does nothing until the GCP_* repository variables exist — create them with scripts/gcp-setup.sh.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation: GitHub OIDC token -> short-lived GCP credentials

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  SERVICE: bookingbot-api

jobs:
  deploy:
    name: Build & Deploy
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/bookingbot/bookingbot-api:${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=cloudrun
          cache-to: type=gha,scope=cloudrun,mode=max

      # Migrations and demo seeding run once per deploy as a Cloud Run job, so the service itself starts in a few
      # seconds after idling (DB_SETUP_ON_START=false below) instead of ~22s
      - name: Migrate and Seed Database
        run: |
          gcloud run jobs deploy bookingbot-setup \
            --region="${{ vars.GCP_REGION }}" \
            --image="${{ env.IMAGE }}" \
            --service-account="${{ vars.GCP_RUNTIME_SA }}" \
            --command=sh --args=scripts/start.sh,setup \
            --set-env-vars=APP_ENV=production,SEED_DEMO_DATA=true,TIMEZONE=Asia/Ho_Chi_Minh \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest \
            --cpu=1 --memory=512Mi --max-retries=0 --task-timeout=600 \
            --execute-now --wait

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # DATABASE_URL, JWT_SECRET, the Anthropic and OpenRouter keys and the Langfuse keys come from Secret Manager
          env_vars: |-
            APP_ENV=production
            CORS_ORIGINS=${{ vars.CLOUD_RUN_CORS_ORIGINS }}
            # Main model: Claude Sonnet; Gemini through OpenRouter answers when Claude fails or runs out of credit
            LLM_PROVIDER=anthropic
            MODEL_NAME=claude-sonnet-5-5
            LLM_EFFORT=medium
            LLM_FALLBACK_PROVIDER=openrouter
            MODEL_FALLBACK_NAME=google/gemini-3.8-flash
            # Traces of AI chat turns (src/services/llm_observability.py)
            LANGFUSE_BASE_URL=https://cloud.langfuse.com
            # Sign-in codes by real SMS: Firebase Phone Auth (Firebase added to this GCP project). The web API key is
            # public (it ships to the browser); demo phones are Firebase "Phone numbers for testing" with fixed codes
            OTP_PROVIDER=firebase
            FIREBASE_PROJECT_ID=booking-bot-510910
            FIREBASE_WEB_API_KEY=AIzaSyDYR4D56eErKNaps9QgaioGynRAuL_0Sl4
            # Uploaded photos are served by this API; the web app on Vercel needs its full address
            PUBLIC_API_URL=https://bookingbot-api-wlvipunyga-as.a.run.app
            # Done by the "Migrate and Seed Database" step; the jobs still top up demo viewing slots daily
            DB_SETUP_ON_START=false
            SEED_DEMO_DATA=true
            TIMEZONE=Asia/Ho_Chi_Minh
          secrets: |-
            DATABASE_URL=DATABASE_URL:latest
            JWT_SECRET=JWT_SECRET:latest
            ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
            OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest
            LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest
            LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest
          # max-instances=1: hold expiry, reminders and follow-ups run in-process (src/jobs.py) and must not
          # run twice. min-instances=1 keeps one instance up so users never wait for a cold start (idle billing,
          # roughly $10-15/month); CPU is still throttled between requests, so those jobs only run while requests
          # come in. The Cloud Scheduler ping (scripts/gcp-setup.sh) calls /health every 5 minutes so they keep going.
          # Long timeout: the AI chat streams over SSE.
          flags: >-
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --allow-unauthenticated
            --port=8000
            --cpu=1
            --memory=512Mi
            --min-instances=1
            --max-instances=1
            --concurrency=80
            --timeout=300
            --cpu-boost

      - name: Smoke Test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/health"

      - name: Summary
        run: echo "Deployed ${{ env.IMAGE }} to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
