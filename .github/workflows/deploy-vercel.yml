name: Deploy Frontend to Vercel

# Vercel Hobby cannot deploy a private repo owned by a GitHub organization through its Git integration,
# so the frontend is deployed from here with the Vercel CLI instead.
# Does nothing until the VERCEL_ORG_ID / VERCEL_PROJECT_ID repository variables exist; also needs the VERCEL_TOKEN secret.
# Build-time env (VITE_API_URL, ...) comes from the Vercel project's Production environment via `vercel pull`.
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    if: vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The project's Root Directory is `frontend`, so the CLI runs from the repo root
      - name: Pull Production Settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
